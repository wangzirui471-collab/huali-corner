[project]
name = "huali-api"
version = "0.1.0"
requires-python = ">=3.13,<3.15"
dependencies = ["fastapi==0.157.0", "Pillow==12.3.0", "uvicorn>=0.35,<1"]

[dependency-groups]
dev = ["httpx>=0.28,<1", "ruff>=0.14,<1", "mypy>=1.18,<2"]

[tool.uv]
package = false

[tool.ruff]
target-version = "py313"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D101", "D102", "D103"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.mypy]
python_version = "3.13"
strict = true
mypy_path = "src"
files = ["src", "scripts"]
