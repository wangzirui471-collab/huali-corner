$kind: http-request
name: 03 注册卖家 · POST /api/auth/register
order: 3000
method: POST
url: '{{baseUrl}}/api/auth/register'
headers:
- key: Content-Type
  value: application/json
body:
  type: json
  content: |-
    {
      "phone": "{{sellerPhone}}",
      "password": "{{pwd}}",
      "nickname": "Postman卖家",
      "college": "计算机工程学院",
      "grade": "2024级",
      "major": "计算机科学与技术"
    }
scripts:
- type: afterResponse
  code: |-
    const t0 = Date.now();
    const status = pm.response.code;
    console.log(`${pm.info.requestName} → ${status} (${pm.response.responseTime}ms)`);

    pm.test('状态码符合预期 200/400', () => {
        pm.expect(status).to.be.oneOf([200, 400]);
    });

    pm.test('响应时间 < 5s', () => pm.expect(pm.response.responseTime).to.be.below(5000));

    // 服务端统一错误体：{error: '...'}。成功响应里不该出现 error。
    const isJson = (pm.response.headers.get('Content-Type') || '').includes('json');
    if (isJson) {
        const body = (() => { try { return pm.response.json(); } catch (e) { return null; } })();
        if (status >= 400) {
            pm.test('错误响应带 error 字段', () => {
                pm.expect(body && body.error).to.be.a('string').and.not.empty;
            });
        } else {
            pm.test('成功响应没有 error 字段', () => {
                // 列表类接口直接返回数组，这里两者都合法
                pm.expect(body === null || typeof body === 'object' || Array.isArray(body)).to.eql(true);
                if (body && !Array.isArray(body)) { pm.expect(body.error).to.be.undefined; }
            });
            if (body.token !== undefined) {
                pm.collectionVariables.set('sellerToken', body.token);
            }
            if (body.user.id !== undefined) {
                pm.collectionVariables.set('sellerId', body.user.id);
            }
            if (body.user.nickname !== undefined) {
                pm.collectionVariables.set('sellerNick', body.user.nickname);
            }
        }
    }
  language: text/javascript
