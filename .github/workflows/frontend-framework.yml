name: 当前网页版 Vue 框架验证

on:
  pull_request:
    paths:
      - 'web 7M/**'
      - 'tests/**'
      - 'scripts/test-current-web.mjs'
      - '.github/workflows/frontend-framework.yml'
  push:
    branches: [main, 'refactor/vue3-*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: 'web 7M/package-lock.json'
      - name: 安装项目锁定依赖
        working-directory: 'web 7M'
        run: npm ci --no-audit --no-fund
      - name: 构建并检查原前端与框架合同
        working-directory: 'web 7M'
        run: npm test
